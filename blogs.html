    <script>
        // FBI 
        const apiUrl = 'https://api.fbi.gov/wanted/v1/list';

fetch(apiUrl)
  .then(response => {
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }
    return response.json();
  })
  .then(data => {
    const wantedListDiv = document.getElementById('wanted-list');
    
    // Check if there are items in the response
    if (data.items && data.items.length > 0) {
      data.items.forEach(item => {
        const wantedItemDiv = document.createElement('div');
        wantedItemDiv.className = 'wanted-item col-md-4 mb-3 col-lg-3 overflow-hidden';
        
        // Create content for each wanted individual
        wantedItemDiv.innerHTML = `<div class='card p-3 overflow-hidden'>
          <h3 class='card-title'>${item.title}</h3>
          <img src="${item.images[0].original}" class=" img-thumbnail "  alt="${item.title}">
          <p><strong>Subject:</strong> ${item.subject}</p>
          <p><strong>Published:</strong> ${item.dateAdded}</p>
          <a href="${item.url}" target="_blank">More Info</a>

        </div>
        `;
        
        // Append the item to the list
        wantedListDiv.appendChild(wantedItemDiv);
      });
    } else {
      wantedListDiv.innerHTML = '<p>No wanted individuals found.</p>';
    }
  })
  .catch(error => {
    console.error('Error fetching wanted list:', error);
  });


        const alertPlaceholder = document.getElementById('liveAlertPlaceholder')
const appendAlert = (message, type) => {
  const wrapper = document.createElement('div')
  wrapper.innerHTML = [
    `<div class="alert alert-${type} alert-dismissible" role="alert">`,
    `   <div>${message}</div>`,
    '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
    '</div>'
  ].join('')

  alertPlaceholder.append(wrapper)
}

const alertTrigger = document.getElementById('liveAlertBtn')
if (alertTrigger) {
  alertTrigger.addEventListener('click', () => {
    appendAlert('Sorry the page is just static Demo page Cant login ', 'danger')
  })
}

document.addEventListener('DOMContentLoaded', function () {
    fetch('data/blogs.json')
        .then(response => response.json())
        .then(blogs => {
            const blogContainer = document.getElementById('blog-container');
            blogs.forEach(blog => {
                const blogCard = document.createElement('div');
                blogCard.className = 'col-md-4 mb-4';
                blogCard.innerHTML = `
                    <div class="card h-100">
                        <img src="${blog.imageUrl}" class="card-img-top" alt="${blog.title}">
                        <div class="card-body">
                            <h5 class="card-title">${blog.title}</h5>
                            <p class="card-text">${blog.content.substring(0, 100)}...</p>
                            <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#blogModal" data-title="${blog.title}" data-image="${blog.imageUrl}" data-content="${blog.content}">Read More</button>
                        </div>
                    </div>
                `;
                blogContainer.appendChild(blogCard);
            });

            const blogModal = document.getElementById('blogModal');
            blogModal.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const title = button.getAttribute('data-title');
                const image = button.getAttribute('data-image');
                const content = button.getAttribute('data-content');

                const modalTitle = blogModal.querySelector('.modal-title');
                const modalImage = blogModal.querySelector('#blogModalImage');
                const modalContent = blogModal.querySelector('#blogModalContent');

                modalTitle.textContent = title;
                modalImage.src = image;
                modalContent.textContent = content;
            });
        });
});
    </script>
